<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ 灵境抽卡 · 天马星空 ✦</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0d0b1a 0%, #1a1035 40%, #0d0b1a 100%);
            font-family: 'Georgia', 'Songti SC', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e8e0f0;
        }

        /* ===== 主容器 ===== */
        .app {
            max-width: 720px;
            width: 100%;
            background: rgba(18, 14, 36, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 28px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.08);
            transition: all 0.3s;
            position: relative;
        }

        /* ===== 顶部信息栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.10);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f6e6a6, #f0c850, #d4a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        .app-sub {
            font-size: 13px;
            color: rgba(200, 190, 220, 0.6);
            letter-spacing: 2px;
            -webkit-text-fill-color: rgba(200, 190, 220, 0.6);
        }

        .header-right {
            text-align: right;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(200, 190, 220, 0.7);
        }

        .header-right .time {
            font-size: 15px;
            font-weight: 600;
            color: #d4c8e8;
        }

        .header-right .date {
            font-size: 12px;
            color: rgba(200, 190, 220, 0.5);
        }

        /* ===== 卡片容器 ===== */
        .card-wrapper {
            perspective: 1200px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto 28px;
            aspect-ratio: 3 / 4;
            cursor: default;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        /* ===== 卡片正面 (卡背) ===== */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            text-align: center;
            overflow: hidden;
        }

        .card-back {
            background: radial-gradient(ellipse at 30% 20%, #2a1f4a, #0f0b1e 80%);
            border: 2px solid rgba(255, 215, 0, 0.15);
            box-shadow: inset 0 0 80px rgba(255, 215, 0, 0.04);
            transform: rotateY(0deg);
        }

        .card-back::before {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            pointer-events: none;
        }

        .card-back .back-pattern {
            font-size: 72px;
            letter-spacing: 16px;
            opacity: 0.15;
            font-weight: 300;
            line-height: 1;
            background: linear-gradient(135deg, #f0c850, #d4a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.05);
            user-select: none;
        }

        .card-back .back-label {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255, 215, 0, 0.25);
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .card-back .back-shine {
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.04), transparent 60%);
            pointer-events: none;
            animation: shimmer 6s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% {
                transform: translate(-10%, -10%) rotate(0deg);
            }

            100% {
                transform: translate(10%, 10%) rotate(10deg);
            }
        }

        /* ===== 卡片正面 (内容) ===== */
        .card-front {
            transform: rotateY(180deg);
            background: radial-gradient(ellipse at 50% 30%, #1f1a3a, #0b0818 90%);
            border: 2px solid rgba(255, 215, 0, 0.10);
            box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.02);
            justify-content: space-between;
            padding: 28px 22px 24px;
        }

        .card-front .rarity-badge {
            position: absolute;
            top: 16px;
            right: 18px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-front .card-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 8px;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.08);
        }

        .card-front .card-divider {
            width: 48px;
            height: 2px;
            margin: 10px auto 14px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
        }

        .card-front .card-message {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(220, 210, 240, 0.85);
            padding: 0 4px;
            max-width: 90%;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .card-front .card-footer {
            font-size: 12px;
            color: rgba(200, 190, 220, 0.3);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .card-front .card-glow {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            pointer-events: none;
            background: radial-gradient(circle at 50% 120%, rgba(255, 215, 0, 0.04), transparent 70%);
        }

        /* ===== 稀有度配色 ===== */
        .rarity-ssr .rarity-badge {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.08);
        }

        .rarity-ssr .card-name {
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .rarity-ssr .card-divider {
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }

        .rarity-ssr .card-front {
            border-color: rgba(255, 215, 0, 0.20);
            box-shadow: inset 0 0 80px rgba(255, 215, 0, 0.04), 0 0 60px rgba(255, 215, 0, 0.03);
        }

        .rarity-sr .rarity-badge {
            color: #b388ff;
            border-color: rgba(179, 136, 255, 0.25);
            background: rgba(179, 136, 255, 0.06);
        }

        .rarity-sr .card-name {
            color: #b388ff;
            text-shadow: 0 0 30px rgba(179, 136, 255, 0.10);
        }

        .rarity-sr .card-divider {
            background: linear-gradient(90deg, transparent, #b388ff, transparent);
        }

        .rarity-sr .card-front {
            border-color: rgba(179, 136, 255, 0.12);
            box-shadow: inset 0 0 60px rgba(179, 136, 255, 0.02);
        }

        .rarity-r .rarity-badge {
            color: #64b5f6;
            border-color: rgba(100, 181, 246, 0.20);
            background: rgba(100, 181, 246, 0.04);
        }

        .rarity-r .card-name {
            color: #64b5f6;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.06);
        }

        .rarity-r .card-divider {
            background: linear-gradient(90deg, transparent, #64b5f6, transparent);
        }

        .rarity-n .rarity-badge {
            color: #90a4ae;
            border-color: rgba(144, 164, 174, 0.15);
            background: rgba(144, 164, 174, 0.03);
        }

        .rarity-n .card-name {
            color: #b0bec5;
            text-shadow: 0 0 12px rgba(144, 164, 174, 0.04);
        }

        .rarity-n .card-divider {
            background: linear-gradient(90deg, transparent, #90a4ae, transparent);
        }

        /* ===== 按钮 ===== */
        .draw-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 20px;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 6px;
            font-family: inherit;
            background: linear-gradient(135deg, #f6e6a6, #e8b830);
            color: #1a1035;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.25);
        }

        .draw-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .draw-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .draw-btn .btn-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent 60%);
            pointer-events: none;
            animation: btnShine 4s ease-in-out infinite alternate;
        }

        @keyframes btnShine {
            0% {
                transform: translate(-10%, -10%);
            }

            100% {
                transform: translate(10%, 10%);
            }
        }

        /* ===== 历史记录 ===== */
        .history {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .history-title {
            font-size: 13px;
            color: rgba(200, 190, 220, 0.3);
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 34px;
        }

        .history-item {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(200, 190, 220, 0.5);
            letter-spacing: 1px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .history-item:hover {
            background: rgba(255, 215, 0, 0.06);
            border-color: rgba(255, 215, 0, 0.15);
            transform: scale(1.02);
        }

        .history-item .h-rarity {
            font-weight: 700;
            font-size: 11px;
        }

        .history-item .h-name {
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-empty {
            font-size: 12px;
            color: rgba(200, 190, 220, 0.15);
            letter-spacing: 2px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .modal-box {
            max-width: 420px;
            width: 90%;
            background: radial-gradient(ellipse at 50% 30%, #1f1a3a, #0b0818 90%);
            border-radius: 32px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            animation: modalPop 0.4s ease;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 24px;
            color: rgba(200, 190, 220, 0.3);
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
            font-family: inherit;
        }

        .modal-close:hover {
            color: #f0c850;
        }

        .modal-rarity {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .modal-name {
            font-size: 30px;
            font-weight: 700;
            margin: 8px 0 4px;
            letter-spacing: 4px;
        }

        .modal-divider {
            width: 60px;
            height: 2px;
            margin: 12px auto 16px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
        }

        .modal-message {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(220, 210, 240, 0.85);
            font-style: italic;
            padding: 0 4px;
            margin-bottom: 16px;
        }

        .modal-footer {
            font-size: 13px;
            color: rgba(200, 190, 220, 0.4);
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .app {
                padding: 18px 14px 24px;
                border-radius: 32px;
            }

            .app-title {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .header-right .time {
                font-size: 13px;
            }

            .card-wrapper {
                max-width: 300px;
            }

            .card-front .card-name {
                font-size: 22px;
            }

            .card-front .card-message {
                font-size: 14px;
            }

            .draw-btn {
                font-size: 17px;
                padding: 14px 20px;
                max-width: 240px;
                letter-spacing: 4px;
            }

            .history-item {
                font-size: 11px;
                padding: 3px 10px;
            }

            .modal-box {
                padding: 24px 18px;
            }

            .modal-name {
                font-size: 24px;
            }

            .modal-message {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .card-wrapper {
                max-width: 240px;
            }

            .card-front .card-name {
                font-size: 18px;
            }

            .card-front .card-message {
                font-size: 12px;
                line-height: 1.6;
            }

            .card-front .rarity-badge {
                font-size: 11px;
                padding: 2px 10px;
                top: 12px;
                right: 12px;
            }
        }

        /* ===== 抽卡动画 ===== */
        .card-inner.pop {
            animation: cardPop 0.5s ease;
        }

        @keyframes cardPop {
            0% {
                transform: rotateY(180deg) scale(0.92);
            }

            50% {
                transform: rotateY(180deg) scale(1.04);
            }

            100% {
                transform: rotateY(180deg) scale(1);
            }
        }

        .draw-btn .btn-text {
            position: relative;
            z-index: 1;
        }

        .star-deco {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            opacity: 0.15;
            animation: floatStar 20s ease-in-out infinite alternate;
        }

        @keyframes floatStar {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.08;
            }

            100% {
                transform: translate(30px, -30px) scale(1.2);
                opacity: 0.18;
            }
        }

        .sparkle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffd700;
            box-shadow: 0 0 12px #ffd700;
            animation: sparkleAnim 1.2s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .card-front .card-message {
            transition: opacity 0.6s;
        }

        .card-front .card-message.highlight {
            animation: msgGlow 0.8s ease 2;
        }

        @keyframes msgGlow {

            0%,
            100% {
                opacity: 0.85;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
            }
        }
    </style>
</head>

<body>

    <!-- ===== 背景装饰星星 ===== -->
    <div class="star-deco" style="top:8%;left:5%;">✦</div>
    <div class="star-deco" style="bottom:12%;right:6%;animation-delay:-6s;">✦</div>
    <div class="star-deco" style="top:40%;right:3%;animation-delay:-12s;font-size:14px;">✦</div>
    <div class="star-deco" style="bottom:30%;left:4%;animation-delay:-8s;font-size:16px;">✦</div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">
        <!-- 顶部 -->
        <div class="header">
            <div class="header-left">
                <div class="app-title">✦ 灵境抽卡</div>
                <div class="app-sub">· 天马星空 ·</div>
            </div>
            <div class="header-right">
                <div class="time" id="currentTime">--:--:--</div>
                <div class="date" id="currentDate">----年--月--日</div>
            </div>
        </div>

        <!-- 卡片 -->
        <div class="card-wrapper" id="cardWrapper">
            <div class="card-inner" id="cardInner">
                <!-- 卡背 -->
                <div class="card-face card-back">
                    <div class="back-shine"></div>
                    <div class="back-pattern">✦ ✦ ✦</div>
                    <div class="back-label">· 灵 · 境 ·</div>
                </div>
                <!-- 卡面 -->
                <div class="card-face card-front rarity-n" id="cardFront">
                    <div class="card-glow"></div>
                    <div class="rarity-badge" id="rarityBadge">N</div>
                    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;">
                        <div class="card-name" id="cardName">—</div>
                        <div class="card-divider"></div>
                        <div class="card-message" id="cardMessage">点击「抽卡」开启灵境</div>
                    </div>
                    <div class="card-footer" id="cardFooter">✦ 天马星空 · 灵境 ✦</div>
                </div>
            </div>
        </div>

        <!-- 按钮 -->
        <button class="draw-btn" id="drawBtn">
            <span class="btn-shine"></span>
            <span class="btn-text" id="btnText">✦ 抽 卡 ✦</span>
        </button>

        <!-- 历史 -->
        <div class="history">
            <div class="history-title">— 灵 境 记 录 —</div>
            <div class="history-list" id="historyList">
                <span class="history-empty">尚未抽卡，静待缘分</span>
            </div>
        </div>
    </div>

    <!-- ===== 模态框 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-rarity" id="modalRarity" style="color:#ffd700;">✦ SSR</div>
            <div class="modal-name" id="modalName" style="color:#ffd700;">天马踏星</div>
            <div class="modal-divider"></div>
            <div class="modal-message" id="modalMessage">天马踏星，光耀九州。命格天成，所愿皆成，大吉大利。</div>
            <div class="modal-footer">
                <span id="modalDate">2026-07-30</span>
                <span id="modalTime">14:30:00</span>
                <span id="modalFortune">福运 105%</span>
            </div>
        </div>
    </div>

    <!-- ===== 闪动画布 ===== -->
    <div class="sparkle-container" id="sparkleContainer"></div>

    <script>
        // ============================================================
        //  1. 卡 片 数 据 （天马星空 · 500签）
        // ============================================================
        const CARDS = {
            SSR: [
                { name: '天马踏星', msg: '天马踏星，光耀九州。命格天成，所愿皆成，大吉大利。' },
                { name: '龙马腾云', msg: '龙马腾云，瑞霭缭绕。风云际会，飞黄腾达，上上大吉。' },

        function getTimePeriod() {
            const h = new Date().getHours();
            if (h >= 5 && h < 9) return 'dawn';
            if (h >= 9 && h < 13) return 'morning';
            if (h >= 13 && h < 18) return 'afternoon';
            if (h >= 18 && h < 21) return 'dusk';
            if (h >= 21 && h < 24) return 'night';
            return 'midnight';
        }

        const TIME_FORTUNE = {
            dawn: { label: '🌅 破晓 · 新生', msg: '晨光熹微，万物复苏，鸿运初开。' },
            morning: { label: '☀️ 朝阳 · 蓬勃', msg: '朝阳正盛，光芒万丈，吉星高照。' },

        function getLunarAndCalendar() {
            const now = new Date();
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();

            const seed = (year * 10000 + month * 100 + day) % 1000;
            const lunarDay = ((day + 7) % 30) + 1;
            const lunarMonth = ((month + 3) % 12) + 1;
            const lunarYear = year - 4;

            const yiPool = ['祭祀', '祈福', '求嗣', '开光', '出行', '嫁娶', '纳财', '入宅', '安床', '动土'];
            const jiPool = ['动土', '安葬', '诉讼', '远行', '破土', '斋醮', '伐木', '作灶', '行丧', '开市'];

            const yiCount = 2 + (seed % 2);
            const jiCount = 2 + ((seed + 3) % 2);

            const yiList = [];
            const jiList = [];
            const usedYi = new Set();
            const usedJi = new Set();

            for (let i = 0; i < yiCount; i++) {
                let idx = (seed + i * 7) % yiPool.length;
                let tryCount = 0;
                while (usedYi.has(idx) && tryCount < 20) {
                    idx = (idx + 1) % yiPool.length;
                    tryCount++;
                }
                usedYi.add(idx);
                yiList.push(yiPool[idx]);
            }

            for (let i = 0; i < jiCount; i++) {
                let idx = (seed + i * 11 + 5) % jiPool.length;
                let tryCount = 0;
                while (usedJi.has(idx) && tryCount < 20) {
                    idx = (idx + 1) % jiPool.length;
                    tryCount++;
                }
                usedJi.add(idx);
                jiList.push(jiPool[idx]);
            }

            let fortune = 1.0;
            const goodWords = ['祭祀', '祈福', '求嗣', '开光', '嫁娶', '纳财'];
            const badWords = ['动土', '安葬', '诉讼', '破土', '伐木', '作灶'];
            for (const item of yiList) {
                if (goodWords.includes(item)) fortune += 0.05;
            }
            for (const item of jiList) {
                if (badWords.includes(item)) fortune -= 0.05;
            }
            fortune = Math.min(1.2, Math.max(0.8, fortune));

            return {
                lunar: `${lunarYear}年${lunarMonth}月${lunarDay}日`,
                yi: yiList,
                ji: jiList,
                fortune: fortune,
                message: fortune >= 1.1 ? '吉星拱照，运道亨通。' :
                    fortune <= 0.9 ? '宜守不宜攻，静待天时。' : '平顺无波，中庸之道。'
            };
        }

        function drawCard() {
            const cal = getLunarAndCalendar();
            const fortune = cal.fortune;

            // 基础概率（SSR 10%, SR 30%, R 50%, N 10%）
            // fortune (0.8~1.2) 调整 SSR/SR 概率，R/N 保持基线
            const rawSSR = RARITY_CONFIG.SSR.prob * fortune;
            const rawSR = RARITY_CONFIG.SR.prob * fortune;
            const rawR = RARITY_CONFIG.R.prob;
            const rawN = RARITY_CONFIG.N.prob;

            // 四者一起归一化
            const total = rawSSR + rawSR + rawR + rawN;
            const adjustedSSR = rawSSR / total;
            const adjustedSR = rawSR / total;
            const adjustedR = rawR / total;
            const adjustedN = rawN / total;

            let r = Math.random();
            let selectedRarity = 'N';
            if (r < adjustedSSR) selectedRarity = 'SSR';
            else if (r < adjustedSSR + adjustedSR) selectedRarity = 'SR';
            else if (r < adjustedSSR + adjustedSR + adjustedR) selectedRarity = 'R';
            else selectedRarity = 'N';

            const pool = CARDS[selectedRarity];
            const card = pool[Math.floor(Math.random() * pool.length)];

            const period = getTimePeriod();
            const timeInfo = TIME_FORTUNE[period];

            let parts = [card.msg];
            if (Math.random() > 0.3) {
                parts.push(timeInfo.msg);
            }
            if (fortune >= 1.1) {
                parts.push('今日天时地利，宜' + cal.yi.slice(0, 2).join('、') + '，大吉。');
            } else if (fortune <= 0.9) {
                parts.push('今日宜静不宜动，忌' + cal.ji.slice(0, 2).join('、') + '，慎之。');
            } else {
                parts.push(cal.message);
            }

            let fullMsg = parts.join(' ');
            if (fullMsg.length > 90) {
                fullMsg = fullMsg.slice(0, 88) + '…';
            }

            return {
                rarity: selectedRarity,
                card: card,
                timeLabel: timeInfo.label,
                lunar: cal.lunar,
                yi: cal.yi,
                ji: cal.ji,
                fortune: fortune,
                fullMessage: fullMsg,
                timestamp: new Date().toLocaleString(),
            };
        }

            const container = sparkleContainer;
            const count = 28 + Math.floor(Math.random() * 20);
            const colors = ['#ffd700', '#ffec8b', '#fff4c0', '#b388ff', '#64b5f6', '#ffab91'];

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'sparkle';
                const size = 4 + Math.random() * 8;
                const x = 20 + Math.random() * 60;
                const y = 20 + Math.random() * 60;
                const tx = (Math.random() - 0.5) * 400;
                const ty = (Math.random() - 0.5) * 400;
                el.style.cssText = `
                        left: ${x}%;
                        top: ${y}%;
                        width: ${size}px;
                        height: ${size}px;
                        background: ${colors[Math.floor(Math.random() * colors.length)]};
                        box-shadow: 0 0 ${size * 2}px ${colors[Math.floor(Math.random() * colors.length)]};
                        --tx: ${tx}px;
                        --ty: ${ty}px;
                        animation-duration: ${0.8 + Math.random() * 0.6}s;
                        animation-delay: ${Math.random() * 0.3}s;
                    `;
                container.appendChild(el);
                setTimeout(() => el.remove(), 1500);
            }
        }

        function init() {
            history = loadHistory();
            renderHistory();

            updateHeader();
            setInterval(updateHeader, 1000);

            drawBtn.addEventListener('click', performDraw);
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    performDraw();
                }
            });

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });

            console.log('✦ 灵境抽卡 · 天马星空 ✦ 已开启');
            console.log('💡 按 空格键 快速抽卡');
        }

        init();
    </script>
</body>

</html>
